function valid(s){if(!s||!Number.isInteger(s.n)||s.n<2||s.n>40||!Array.isArray(s.groups)||!Array.isArray(s.open)||s.groups.length!==s.n||s.open.length!==s.n)return false;return s.groups.every(v=>v===0||v===1)&&s.open.every(v=>typeof v==='boolean')&&Math.abs(s.groups.filter(v=>v===0).length-s.groups.filter(v=>v===1).length)<=1}
try{const old=JSON.parse(localStorage.getItem(KEY));if(old){if(valid(old.state))state=old.state;if(typeof old.sound==='boolean')sound=old.sound}}catch(e){}
function rand(max){if(globalThis.crypto?.getRandomValues){const b=new Uint32Array(1),limit=4294967296-4294967296%max;do{crypto.getRandomValues(b)}while(b[0]>=limit);return b[0]%max}return Math.floor(Math.random()*max)}
function makeState(n){const extra=rand(2),a=Array.from({length:n},(_,i)=>i<Math.floor(n/2)+(n%2&&extra===0?1:0)?0:1);for(let i=n-1;i>0;i--){let j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return{n,groups:a,open:Array(n).fill(false)}}
function initAudio(){try{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume().catch(()=>{})}catch(e){}}
function notes(final=false){if(!sound||!audio||audio.state!=='running')return;try{const t=audio.currentTime;const sequence=final?[523.25,659.25,783.99,1046.5]:[659.25,880];sequence.forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain(),at=t+i*(final?.095:.08);o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(.055,at+.012);g.gain.exponentialRampToValueAtTime(.0001,at+.13);o.connect(g);g.connect(audio.destination);o.start(at);o.stop(at+.14)})}catch(e){}}
function updateSound(){$('sound').textContent=sound?'♪ Дыбыс қосулы':'♪ Дыбыс өшірулі';$('sound').setAttribute('aria-pressed',String(sound))}
function update(){const nums=[[],[]];if(state)state.open.forEach((v,i)=>{if(v)nums[state.groups[i]].push(i+1)});['blue','gold'].forEach((key,g)=>{$(key+'Count').textContent=nums[g].length+' студент';$(key+'Nums').textContent=nums[g].length?nums[g].map(n=>'№'+n).join(', '):'Әзірге таңдау жоқ'});const done=nums[0].length+nums[1].length,n=state?.n||Number($('size').value)||12;$('remaining').textContent='Қалды: '+(n-done);$('bar').style.transform=`scaleX(${done/n})`;$('message').innerHTML=done===n?'<strong>Топтар дайын!</strong>':state?'Кез келген құпия құбырды таңдаңыз':'Құпия құбырлар сіздерді күтеді'}
function columns(n){return n<=4?n:n<=6?3:n<=16?4:n<=25?5:n<=30?6:8}
function render(){const grid=$('grid');grid.replaceChildren();if(!state){const intro=document.createElement('div');intro.className='intro';intro.innerHTML=`<img src="${ASSETS.pipe}" alt="Құпия құбыр"><p>Студент санын таңдаңыз да, «Бастау» батырмасын басыңыз</p>`;grid.append(intro);update();return}grid.style.setProperty('--cols',columns(state.n));grid.style.setProperty('--rows',Math.ceil(state.n/columns(state.n)));for(let i=0;i<state.n;i++){const b=document.createElement('button');b.type='button';b.className='card';b.dataset.index=i;b.innerHTML=`<span class="number">${i+1}</span><span class="face front"><img src="${ASSETS.pipe}" alt="" draggable="false"></span><span class="face back"><img alt="" draggable="false"><b></b></span>`;b.setAttribute('aria-label',`№${i+1} құпия құбырды ашу`);b.setAttribute('aria-pressed','false');const g=state.groups[i];b.querySelector('.back img').src=ASSETS[g===0?'blue':'gold'];b.querySelector('b').textContent=NAMES[g];b.addEventListener('click',()=>select(i,b));grid.append(b);if(state.open[i])paint(i,b)}update()}
function paint(i,b){b.classList.add('opened',state.groups[i]===0?'blue':'gold');b.setAttribute('aria-pressed','true');b.setAttribute('aria-label',`№${i+1}: ${NAMES[state.groups[i]]}`)}
function select(i,b){if(!ready||!state||state.open[i])return;state.open[i]=true;if(!audio)initAudio();paint(i,b);update();queueSave();if(state.open.every(Boolean)){notes(true);celebrate()}else notes()}
function celebrate(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const box=$('confetti');box.replaceChildren();for(let i=0;i<28;i++){const el=document.createElement('i');el.style.left=(i*3.7)%100+'%';el.style.background=['#287bc1','#d9b65f','#64c9df'][i%3];el.style.setProperty('--dx',(i%2?70:-70)+'px');el.style.animationDelay=(i%5)*.035+'s';el.addEventListener('animationend',()=>el.remove(),{once:true});box.append(el)}}
function begin(n){state=makeState(n);$('setup').hidden=true;$('size').value=n;render();save()}
$('setup').addEventListener('submit',e=>{e.preventDefault();if(!ready||!$('size').checkValidity())return;initAudio();begin(Number($('size').value))});
$('sound').onclick=()=>{sound=!sound;if(sound)initAudio();updateSound();save()};
$('settings').onclick=()=>{$('setup').hidden=!$('setup').hidden;if(!$('setup').hidden){$('size').focus();$('size').select()}};
$('reset').onclick=()=>{if(!ready)return;if(!confirm('Карточкаларды қайта араластырып, жаңа топқа бөлуді бастайсыз ба?'))return;initAudio();begin(state?.n||12)};
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){$('fullscreen').textContent='Толық экран: F11'}};
document.addEventListener('fullscreenchange',()=>{$('fullscreen').textContent=document.fullscreenElement?'⛶ Экраннан шығу':'⛶ Толық экран'});
$('grid').addEventListener('keydown',e=>{const cards=[...$('grid').querySelectorAll('.card')],i=cards.indexOf(document.activeElement);if(i<0)return;const cols=getComputedStyle($('grid')).gridTemplateColumns.split(' ').length;let j=i;if(e.key==='ArrowRight')j=i+1;else if(e.key==='ArrowLeft')j=i-1;else if(e.key==='ArrowDown')j=i+cols;else if(e.key==='ArrowUp')j=i-cols;else if(e.key==='Home')j=0;else if(e.key==='End')j=cards.length-1;else return;e.preventDefault();cards[Math.max(0,Math.min(cards.length-1,j))].focus()});
window.addEventListener('pagehide',save);updateSound();if(state){$('setup').hidden=true;$('size').value=state.n}render();
Promise.all(Object.values(ASSETS).map(src=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{(im.decode?im.decode():Promise.resolve()).then(resolve,resolve)};im.onerror=reject;im.src=src}))).then(()=>{ready=true;$('start').disabled=false;$('start').textContent='Бастау'}).catch(()=>{$('message').textContent='Суреттерді оқу мүмкін болмады. Файлды қайта ашыңыз.'});
</script></html>
